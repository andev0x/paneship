name: Feature request
description: Suggest a new feature or an improvement to Paneship
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Paneship. Please describe the problem first,
        then the proposed solution. Check the
        [roadmap](https://github.com/andev0x/paneship#roadmap) and
        [existing issues](https://github.com/andev0x/paneship/issues) before
        opening a new request.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have checked the roadmap and open pull requests.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
      placeholder: When working in ..., the prompt ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, configuration, or API you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other prompts, or designs you evaluated.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Prompt rendering / layout
        - Git integration
        - Language or runtime detection
        - Infrastructure / environment detection
        - Shell integration
        - Daemon / IPC / caching
        - Configuration / TUI
        - Performance
        - Documentation
        - Build, packaging, or release

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, I can open a pull request"
        - "Yes, with guidance"
        - "No, but I can help test"
        - "No"

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, examples from other tools, or related links.
