name: Release

# Continuous delivery only: tags matching `v*` or a manual dispatch. Every
# target is built on GitHub-hosted Ubuntu runners (free for public repos).
# macOS and Windows binaries are cross-compiled, so no metered runners are
# ever allocated.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave empty to build artifacts only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-verify

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (all targets, warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            method: native
            archive: tar.gz
            bin: paneship
            native: true
          - target: x86_64-unknown-linux-musl
            method: cross
            archive: tar.gz
            bin: paneship
            native: true
          - target: aarch64-unknown-linux-gnu
            method: cross
            archive: tar.gz
            bin: paneship
            native: false
          - target: x86_64-apple-darwin
            method: zigbuild
            archive: tar.gz
            bin: paneship
            native: false
          - target: aarch64-apple-darwin
            method: zigbuild
            archive: tar.gz
            bin: paneship
            native: false
          - target: x86_64-pc-windows-gnu
            method: cross
            archive: zip
            bin: paneship.exe
            native: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.method == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Zig
        if: matrix.method == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.method == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (native)
        if: matrix.method == 'native'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.method == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.method == 'zigbuild'
        env:
          # Apple Silicon requires macOS 11+, so use the same floor for both
          # architectures to keep the two macOS artifacts consistent.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # `libc` unconditionally passes `-liconv` for Apple targets, but Zig's
          # bundled Darwin sysroot has no iconv stub. The committed stub only
          # records the real system install name (no Apple SDK required).
          RUSTFLAGS: "-L ${{ github.workspace }}/.github/macos-stubs"
        run: >-
          cargo zigbuild --release --locked
          --no-default-features --features macos-kqueue
          --target ${{ matrix.target }}

      - name: Verify binary format
        run: file "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: Smoke test (native)
        if: matrix.native
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          staging="paneship-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/${BIN}" "$staging/${BIN}"
          cp README.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          staging="paneship-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/${BIN}" "$staging/${BIN}"
          cp README.md LICENSE "$staging/"
          zip -qr "${staging}.zip" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: paneship-${{ matrix.target }}
          path: paneship-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    # Tag pushes always publish. Manual dispatches publish only when a tag is
    # supplied; otherwise the run stops after producing downloadable artifacts.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
