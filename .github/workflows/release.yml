name: Release

# Continuous delivery only: tags matching `v*` or a manual dispatch.
#
# Cost model: every job runs on `ubuntu-latest` standard runners, which are
# free and unmetered for this public repository. macOS and Windows binaries are
# cross-compiled on Ubuntu, so no metered macOS/Windows or larger runners are
# ever allocated. Publishing to crates.io is folded into the existing release
# job so the feature adds no extra runner. Only tag pushes and manual
# dispatches trigger the workflow; pull requests never build release targets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.2.1 (leave empty to build artifacts only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-verify

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (all targets, warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            method: native
            archive: tar.gz
            bin: paneship
            native: true
          - target: x86_64-unknown-linux-musl
            method: cross
            archive: tar.gz
            bin: paneship
            native: true
          - target: aarch64-unknown-linux-gnu
            method: cross
            archive: tar.gz
            bin: paneship
            native: false
          - target: x86_64-apple-darwin
            method: zigbuild
            archive: tar.gz
            bin: paneship
            native: false
          - target: aarch64-apple-darwin
            method: zigbuild
            archive: tar.gz
            bin: paneship
            native: false
          - target: x86_64-pc-windows-gnu
            method: cross
            archive: zip
            bin: paneship.exe
            native: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.method == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Zig
        if: matrix.method == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.method == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (native)
        if: matrix.method == 'native'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.method == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.method == 'zigbuild'
        env:
          # Apple Silicon requires macOS 11+, so use the same floor for both
          # architectures to keep the two macOS artifacts consistent.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # `libc` unconditionally passes `-liconv` for Apple targets, but Zig's
          # bundled Darwin sysroot has no iconv stub. The committed stub only
          # records the real system install name (no Apple SDK required).
          RUSTFLAGS: "-L ${{ github.workspace }}/.github/macos-stubs"
        run: >-
          cargo zigbuild --release --locked
          --no-default-features --features macos-kqueue
          --target ${{ matrix.target }}

      - name: Verify binary format
        run: file "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: Smoke test (native)
        if: matrix.native
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          staging="paneship-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/${BIN}" "$staging/${BIN}"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          staging="paneship-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/${BIN}" "$staging/${BIN}"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          zip -qr "${staging}.zip" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: paneship-${{ matrix.target }}
          path: paneship-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release + crates.io
    needs: build
    # Tag pushes always publish. Manual dispatches publish only when a tag is
    # supplied; otherwise the run stops after producing downloadable artifacts.
    # Publishing to crates.io happens here instead of in a separate job so no
    # extra runner is allocated for it.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          # On a manual dispatch, publish the tagged source rather than the
          # branch the workflow was started from.
          ref: ${{ inputs.tag || github.ref }}

      # crates.io versions are immutable, so never ship a crate whose version
      # does not match the released tag.
      - name: Verify tag matches crate version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${TAG#v}"
          if [ "${crate_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi

      # Skip gracefully when the version is already on crates.io (e.g. a rerun
      # after a partial release), instead of failing the whole workflow.
      - name: Check whether the version is already published
        id: published
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          crate_version="${TAG#v}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "paneship-release-ci (https://github.com/andev0x/paneship)" \
            "https://crates.io/api/v1/crates/paneship/${crate_version}")"
          if [ "${status}" = "200" ]; then
            echo "paneship ${crate_version} is already on crates.io; skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "${status}" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected crates.io response (HTTP ${status})"
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      # The `verify` job already ran fmt/clippy/tests on this exact commit, so
      # `--no-verify` only skips recompiling the packaged crate in a throwaway
      # directory. `cargo package` still validates the manifest and the file
      # list before anything is uploaded.
      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
