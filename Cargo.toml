[package]
name = "paneship"
version = "1.2.1"
edition = "2021"
rust-version = "1.88"
authors = ["andev0x"]
description = "A blazingly fast, high-performance shell prompt optimized for tmux and large Git repositories"
license = "MIT"
readme = "README.md"
repository = "https://github.com/andev0x/paneship"
homepage = "https://github.com/andev0x/paneship"
documentation = "https://github.com/andev0x/paneship/tree/main/docs"
keywords = ["prompt", "shell", "tmux", "git", "performance"]
categories = ["command-line-utilities"]
# Keep the crates.io package focused on the binary and user-facing files.
# Developer documentation, CI configuration, and local screenshots are not
# needed to build from a published crate.
exclude = [
    "/.github/",
    "/docs/",
    "/img-bugs/",
    "/target/",
    "/Makefile",
]

[dependencies]
gix = "0.70"
unicode-width = "0.2"
libc = "0.2"
terminal_size = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"
toml_edit = "0.25"
tempfile = "3"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
async-trait = "0.1.92"
# `notify`'s macOS backends are selected explicitly so that release binaries for
# `*-apple-darwin` can be cross-compiled on Linux without an Apple SDK. FSEvents
# links the CoreServices framework, which is unavailable to `cargo-zigbuild`;
# the kqueue backend is pure Rust and links only libc. Native macOS builds keep
# FSEvents through the default feature.
notify = { version = "8.2.0", default-features = false }
lru = "0.18.5"
ratatui = "0.30"

[features]
default = ["macos-fsevent"]
# Preferred macOS backend for native builds (efficient recursive watching).
macos-fsevent = ["notify/macos_fsevent"]
# Portable macOS backend used by cross-compiled release binaries; no Apple SDK
# or CoreServices framework is required.
macos-kqueue = ["notify/macos_kqueue"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Release tuning for the sub-millisecond render contract: full LTO and a single
# codegen unit maximise cross-crate inlining (especially through `gix`), and
# symbol stripping keeps the shipped binary small.
#
# `panic` is deliberately left as the default `unwind`: the daemon worker and
# detector harness recover from panics with `catch_unwind` so a single bad
# repository or detector can never take the daemon down. `panic = "abort"`
# would turn those recoverable panics into a process abort and break that
# guarantee.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
