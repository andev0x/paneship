# Paneship Configuration Example
# Save to ~/.config/paneship/config.toml to customize.
#
# Tip: run `paneship config` for an interactive editor with a live preview.

# ---------------------------------------------------------------------------
# Icon set (Phase 2). Selects a glyph profile for every prompt segment so you
# do not have to hand-edit each icon. Any explicit icon below still wins.
#   nerdfont : full Nerd Font glyph suite (requires a patched font)
#   emoji    : universal Unicode emoji
#   minimal  : pure ASCII fallback (SSH / constrained terminals)
# ---------------------------------------------------------------------------
[icons]
profile = "nerdfont"

# ---------------------------------------------------------------------------
# Colour theme (Phase 2). Supplies the directory/git/status/metadata colours.
#   default | dracula | nord | tokyo-night | gruvbox
# ---------------------------------------------------------------------------
[theme]
name = "default"

# ---------------------------------------------------------------------------
# Right-side prompt (RPROMPT, Phase 3). Native right prompts are bound by the
# zsh/fish init scripts; the right region is dropped (and low-priority elements
# collapse first) when the terminal is narrower than rprompt_min_width.
# ---------------------------------------------------------------------------
[prompt]
rprompt = true
rprompt_min_width = 20

# ---------------------------------------------------------------------------
# Infrastructure / environment detectors (Phase 3). Each detector runs in a
# background worker: file probes under a hard 10 ms budget, the opt-in health
# check under a looser 250 ms budget because macOS shells out to `pmset`.
# Nothing runs on the render path.
# ---------------------------------------------------------------------------
[environment]
enabled = true
kubernetes = true   # ~/.kube/config / $KUBECONFIG context + namespace
docker = true       # /.dockerenv, /proc/1/cgroup, $container
cloud = true        # active AWS / GCP / Azure profile
nix_direnv = true   # IN_NIX_SHELL and .envrc state
health = false      # opt-in CPU load pressure / low battery (Linux + macOS)

# ---------------------------------------------------------------------------
# Cache & timeout tuning (environment variables, not TOML).
#
#   PANESHIP_CACHE_CAPACITY   LRU entries per cache (default 500)
#   PANESHIP_GIT_TTL_MS       Git state TTL (default 5000)
#   PANESHIP_LANG_TTL_MS      language metadata TTL (default 60000)
#   PANESHIP_PACKAGE_TTL_MS   package version TTL (default 120000)
#   PANESHIP_ENV_TTL_MS       infrastructure/environment TTL (default 30000)
#
# TTLs are per metadata category so slow-changing detectors (package versions)
# can be cached far longer than fast-moving Git state.
# ---------------------------------------------------------------------------

[directory]
# Empty = use the active icon profile.
icon = ""
# Number of path segments to keep before truncation.
truncation_length = 3
# Truncate to repository root if inside a Git repo.
truncate_to_repo = true

[git]
# Empty = use the active icon profile.
branch_icon = ""
staged_icon = "+"
unstaged_icon = "!"
untracked_icon = "?"

[status]
# Empty = use the active icon profile (➜ / ✗ equivalents).
success_icon = ""
failure_icon = ""

[metadata]
# Optional explicit ANSI SGR colour overrides (empty = use the active theme).
# Examples: "2;37" dim white, "1;32" bright green, "38;5;208" orange.
time_color = ""
paneship_color = ""

# Per-language overrides. Empty fields fall back to the active icon profile
# (icon) and theme (colour).
[metadata.languages.rust]
icon = ""
color = ""

[metadata.languages.python]
icon = ""
color = ""

# ANSI Color Reference:
# Standard colors: 30-37, 90-97
# Bright colors: 1;30 - 1;37
# Custom: 38;5;<color> (256 colors) or 38;2;<r>;<g>;<b> (24-bit)
# Examples:
#   1;31 = bright red
#   1;32 = bright green
#   1;33 = bright yellow
#   1;34 = bright blue
#   1;35 = bright magenta
#   1;36 = bright cyan
#   1;37 = bright white
#   2;37 = dim white
#   38;5;208 = orange (256-color)
